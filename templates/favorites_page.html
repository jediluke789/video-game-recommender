<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites</title>
    <link href="{{ url_for('static', filename='styles/results_style.css')}}" rel="stylesheet" />
</head>
    
<body>
    <h1>Favorites</h1>
    
    {% for game in favorites %}
    <div class="result-row">
        
        <div class="left">
            <img src="{{ game.image }}" class="game-img">
            <p>{{ game.name }} <br> Released: {{ game.released }} <br> Rating: {{ game.rating }}</p>
        </div>

        <div class="right">
            <form action="/remove_favorite" method="GET">
                <input type="hidden" name="title" value="{{ game.name }}">
                <input type="hidden" name="user_id" value="{{ user_id }}">
                <button type="submit">Remove</button>
            </form>
        </div>

    </div>
    {% endfor %}
    
   
    

    <form action="/index">
        <button type="submit">Back to Menu</button>
    </form>
</body>
</html>
